<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公司驾驶舱 · Company Cockpit</title>
<style>
:root{--bg:#06101c;--bg2:#091725;--panel:#0d1c2d;--panel2:#10243a;--line:#203a55;--text:#edf6ff;--muted:#8299b2;--blue:#4b8cff;--blue2:#2d6df6;--green:#33d69f;--red:#ff6378;--amber:#f7b955;--gray:#76889a;--cyan:#4dd9ef;--shadow:0 20px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:radial-gradient(circle at 15% -15%,#143a64 0,transparent 34%),linear-gradient(180deg,#071421,#050b13);min-height:100vh}
button{font:inherit} .app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid #17324c;background:rgba(6,17,29,.93);backdrop-filter:blur(18px);padding:18px 14px;overflow:auto}.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 20px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--blue2));font-weight:1000;color:#03111f;box-shadow:0 0 30px rgba(75,140,255,.34)}.brand b{display:block;font-size:18px}.brand small{font-size:10px;letter-spacing:.12em;color:var(--muted)}
.nav-label{font-size:10px;color:#5f7690;letter-spacing:.14em;margin:10px 9px}.nav{display:grid;gap:5px}.nav button,.dept-sub button{border:1px solid transparent;background:transparent;color:#cfe0f4;border-radius:11px;padding:10px 11px;text-align:left;cursor:pointer;transition:.15s}.nav button:hover,.dept-sub button:hover{background:#0d2338}.nav button.active{background:linear-gradient(90deg,#13376a,#10294a);border-color:#2b5f93}.nav button b{display:block;font-size:13px}.nav button small{display:block;color:#7891ac;margin-top:2px}.dept-sub{display:grid;gap:3px;margin:3px 0 8px 18px;padding-left:10px;border-left:1px solid #1f3c58}.dept-sub button{padding:7px 9px;font-size:11px;color:#91a9c2;display:flex;justify-content:space-between;align-items:center}.dept-sub button.active{background:#0f2a45;color:#dcecff}.mini-dot{width:7px;height:7px;border-radius:50%;background:var(--gray);display:inline-block}.mini-dot.green{background:var(--green);box-shadow:0 0 10px var(--green)}.mini-dot.red{background:var(--red);box-shadow:0 0 10px var(--red)}
.side-foot{margin-top:20px;border-top:1px solid #19334d;padding:16px 9px;color:#7790aa;font-size:11px}.side-live{display:flex;align-items:center;gap:8px;color:#cfe4f7;margin-bottom:5px}
.shell{min-width:0}.top{height:66px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:0 24px;background:rgba(6,17,29,.86);backdrop-filter:blur(16px);border-bottom:1px solid #183550}.top h1{font-size:14px;margin:0}.grow{flex:1}.live-pill,.btn{border:1px solid #274764;background:#0c1f33;color:#dbeeff;border-radius:10px;padding:8px 11px}.live-pill{font-size:11px;display:flex;align-items:center;gap:7px}.btn{cursor:pointer}.btn:hover{border-color:#3b78b0;background:#102b45}.btn.primary{background:linear-gradient(90deg,#235fd8,#315dba);border-color:#4b8cff}.btn.ghost{background:transparent}.content{padding:22px;max-width:1720px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:2px 0 20px}.eyebrow{font-size:10px;color:#5e90c4;letter-spacing:.17em;font-weight:800}.hero h2{font-size:30px;margin:7px 0 4px;letter-spacing:-.03em}.hero p{margin:0;color:var(--muted);font-size:13px}.update{font-size:11px;color:#829ab3}
.grid{display:grid;gap:13px}.pulse{grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:18px}.metric{background:linear-gradient(180deg,rgba(16,38,61,.93),rgba(8,23,38,.95));border:1px solid #1e3c58;border-radius:14px;padding:14px;min-height:104px;box-shadow:var(--shadow)}.metric .k{font-size:10px;color:#7891aa;text-transform:uppercase;letter-spacing:.08em}.metric .v{font-size:29px;font-weight:900;margin-top:13px}.metric .s{font-size:10px;color:#72899f;margin-top:2px}.metric.good .v{color:#78e8bd}.metric.warn .v{color:#ffd17a}.metric.bad .v{color:#ff93a1}.metric.blue .v{color:#8db6ff}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:19px 0 10px}.section-title h3{margin:0;font-size:15px}.section-title span{color:#7892ab;font-size:11px}.dept-wall{grid-template-columns:repeat(4,minmax(0,1fr))}.dept-mini,.dept-card,.attention,.panel{background:linear-gradient(180deg,rgba(14,34,54,.95),rgba(8,23,38,.96));border:1px solid #1d3b58;border-radius:15px;box-shadow:var(--shadow)}.dept-mini{padding:14px;cursor:pointer;transition:.15s;min-height:175px}.dept-mini:hover,.dept-card:hover{border-color:#3478b6;transform:translateY(-1px)}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.dept-mini h4,.dept-card h4{margin:0;font-size:14px}.status-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #31516f;border-radius:999px;padding:4px 8px;font-size:10px;background:#10233a;color:#b9cde0}.status-pill.busy{border-color:#285ba8;background:#102958;color:#9bc0ff}.status-pill.idle{border-color:#3d5368;background:#172330;color:#a9b8c8}.status-pill.disabled,.status-pill.bad{border-color:#7f3341;background:#34161c;color:#ff9daa}.status-pill.attn{border-color:#7f5b20;background:#30240f;color:#ffd37f}.status-pill.good{border-color:#1f7159;background:#0b2b24;color:#8af1c8}
.connection{display:flex;align-items:center;gap:7px;font-size:11px}.lamp{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 12px rgba(255,99,120,.8)}.lamp.on{background:var(--green);box-shadow:0 0 12px rgba(51,214,159,.8)}.task-title{margin:13px 0 8px;font-size:12px;font-weight:800;line-height:1.45;min-height:35px}.muted{color:var(--muted)}.tiny{font-size:10px}.progress{height:7px;border-radius:999px;background:#11263b;overflow:hidden;border:1px solid #193b59}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2e74f4,#53c2ff);border-radius:999px}.progress-meta{display:flex;justify-content:space-between;margin-top:5px;color:#7790aa;font-size:10px}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}.filter{border:1px solid #264663;background:#0b1d30;color:#9db3c9;border-radius:999px;padding:7px 11px;font-size:11px;cursor:pointer}.filter.active{background:#173f72;color:#fff;border-color:#3d7bc0}
.attention-list{display:grid;gap:8px;margin-bottom:16px}.attention{padding:12px 14px;display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;cursor:pointer}.attention .bar{height:100%;min-height:44px;border-radius:8px;background:var(--amber)}.attention.severe .bar{background:var(--red)}.attention b{font-size:12px}.attention small{display:block;color:#899fb6;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:900px}
.dept-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.dept-card{padding:16px;min-height:400px;display:flex;flex-direction:column}.dept-head{display:flex;justify-content:space-between;gap:12px}.dept-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.ability-wrap{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0}.ability{font-size:10px;padding:5px 7px;border-radius:8px;background:#102a43;color:#9fc3e8;border:1px solid #204c73}.task-box{border:1px solid #203f5c;background:#091b2c;border-radius:11px;padding:11px;margin-top:2px}.task-box h5{margin:0 0 7px;font-size:12px}.line-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.summary-line{font-size:10px;color:#819ab3;margin-top:7px;line-height:1.45}.blockage{border:1px solid #6d4924;background:#2b1d0d;color:#ffd18a;border-radius:9px;padding:8px;margin-top:8px;font-size:10px;line-height:1.4}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.stat{background:#0a1c2e;border:1px solid #193953;border-radius:9px;padding:8px;text-align:center}.stat b{display:block;font-size:15px}.stat small{font-size:9px;color:#758ba1}.card-foot{margin-top:auto;border-top:1px solid #19344d;padding-top:10px}.actions{display:flex;gap:7px;margin-top:9px}.actions .btn{font-size:10px;padding:7px 9px;flex:1}
.panel{padding:16px}.services{grid-template-columns:repeat(4,minmax(0,1fr))}.service{padding:11px;border:1px solid #20405c;border-radius:11px;background:#0a1d2f}.service b{font-size:11px}.service small{display:block;color:#7890a8;font-size:9px;margin-top:4px}.lane-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.drawer-scrim,.modal-scrim{position:fixed;inset:0;background:rgba(2,7,12,.72);backdrop-filter:blur(6px);z-index:50;display:none}.drawer-scrim.show,.modal-scrim.show{display:block}.drawer{position:absolute;top:0;right:0;width:min(620px,94vw);height:100%;background:#081726;border-left:1px solid #244763;padding:22px;overflow:auto}.modal-scrim{display:none;place-items:center}.modal-scrim.show{display:grid}.modal{width:min(560px,92vw);background:#091a2b;border:1px solid #2a4f6e;border-radius:18px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.55)}.modal-head{display:flex;justify-content:space-between;align-items:start}.close{background:transparent;border:0;color:#8ca4bb;font-size:24px;cursor:pointer}.detail-section{border-top:1px solid #19354f;margin-top:14px;padding-top:14px}.detail-section h5{margin:0 0 9px;font-size:11px;color:#8fb5d9;text-transform:uppercase;letter-spacing:.08em}.detail-kv{display:grid;grid-template-columns:150px 1fr;gap:7px 12px;font-size:11px}.detail-kv span{color:#7891aa}.detail-kv b{font-weight:600;overflow-wrap:anywhere}.big-lamp{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb2bd,#ff6378 34%,#8c2636 70%);box-shadow:0 0 35px rgba(255,99,120,.48);margin:15px auto}.big-lamp.on{background:radial-gradient(circle at 35% 30%,#c2ffe6,#33d69f 34%,#12674d 70%);box-shadow:0 0 35px rgba(51,214,159,.48)}.connection-title{text-align:center;font-size:18px;font-weight:900}.empty{border:1px dashed #294966;border-radius:12px;padding:24px;text-align:center;color:#7891aa;font-size:11px}
.mobile-toggle{display:none}
@media(max-width:1350px){.pulse{grid-template-columns:repeat(4,1fr)}.dept-wall{grid-template-columns:repeat(3,1fr)}.dept-grid{grid-template-columns:repeat(2,1fr)}.services{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-290px;z-index:80;width:270px;transition:.2s}.sidebar.open{left:0}.mobile-toggle{display:inline-flex}.content{padding:14px}.top{padding:0 14px}.pulse{grid-template-columns:repeat(2,1fr)}.dept-wall,.dept-grid,.services,.lane-grid{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.hero h2{font-size:25px}.attention{grid-template-columns:6px 1fr}.attention>.status-pill{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">▲</div><div><b>公司驾驶舱</b><small>COMPANY COCKPIT · LIVE</small></div></div>
  <div class="nav-label">COMMAND CENTER</div>
  <div class="nav">
    <button data-page="overview" class="active"><b>总览</b><small>Overview</small></button>
    <button data-page="departments"><b>部门总控</b><small>Department Control</small></button>
    <div class="dept-sub" id="deptSub"></div>
    <button data-page="connections"><b>后台连接</b><small>Backend Connections</small></button>
    <button data-page="systems"><b>系统状态</b><small>System Status</small></button>
  </div>
  <div class="side-foot"><div class="side-live"><span class="mini-dot green"></span><b id="sideState">实时连接</b></div><div>公开只读 · Public Read Only</div></div>
</aside>
<div class="shell">
<header class="top">
  <button class="btn ghost mobile-toggle" id="mobileBtn">☰</button>
  <h1 id="crumb">控制中心 / 总览</h1><div class="grow"></div>
  <div class="live-pill"><span class="mini-dot green" id="topDot"></span><span id="liveText">LIVE</span></div>
  <button class="btn" id="refreshBtn">↻ 刷新</button>
</header>
<main class="content" id="page"></main>
</div>
</div>
<div class="drawer-scrim" id="drawerScrim"><aside class="drawer" id="drawer"></aside></div>
<div class="modal-scrim" id="modalScrim"><section class="modal" id="modal"></section></div>
<script>
const API='https://qqbetjlagqfhuczcwmbd.supabase.co/functions/v1/company-cockpit?api=1';
let D=null,page='overview',selected='all',loading=false;
const $=id=>document.getElementById(id);
const arr=v=>Array.isArray(v)?v:[];
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const pct=v=>v===null||v===undefined?null:Math.max(0,Math.min(100,Math.round(Number(v)||0)));
const safeText=v=>{
  let s=String(v??'—');
  s=s.replace(/https?:\/\/\S+/gi,'[链接已隐藏]').replace(/[A-Z]:\\[^\n\r\t]+/g,'[本地路径已隐藏]').replace(/laptop-[a-z0-9-]+/gi,'[设备已隐藏]').replace(/127\.0\.0\.1:\d+/g,'[本地服务]').replace(/CDP[^,;\n]*\d{4,5}/gi,'[CDP信息已隐藏]');
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
};
const stamp=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?safeText(v):d.toLocaleString('zh-CN',{hour12:false})};
const workLabel=v=>v==='busy'?'任务中':v==='idle'?'空闲中':v==='disabled'?'已停用':'未知';
const workClass=v=>v==='busy'?'busy':v==='idle'?'idle':v==='disabled'?'disabled':'';
const stateClass=v=>/active|ready|healthy|online|completed/i.test(v||'')?'good':/disabled|failed|offline|error|critical/i.test(v||'')?'bad':/stale|degraded|blocked|attention|pending|waiting/i.test(v||'')?'attn':'';
const depts=()=>arr(D?.department_control);
const summary=()=>D?.department_summary||{};
const activeMissions=()=>depts().reduce((n,d)=>n+num(d?.task_stats?.missions_active),0);
const activeWork=()=>depts().reduce((n,d)=>n+num(d?.active_work),0);
const onlineLanes=()=>arr(D?.runner?.lanes).filter(x=>x?.last_seen_at).length;
function setPage(p,key){page=p;selected=key||selected;document.querySelectorAll('.nav>button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('sidebar').classList.remove('open');render();}
function nav(){
  $('deptSub').innerHTML='<button class="'+(selected==='all'?'active':'')+'" data-dept="all"><span>全部部门</span><span>'+depts().length+'</span></button>'+depts().map(d=>'<button class="'+(selected===d.department_key?'active':'')+'" data-dept="'+safeText(d.department_key)+'"><span>'+safeText(d.name)+'</span><span class="mini-dot '+(d?.backend?.connected?'green':'red')+'"></span></button>').join('');
  document.querySelectorAll('[data-dept]').forEach(b=>b.onclick=()=>{selected=b.dataset.dept;setPage('departments',selected)});
}
function metric(label,val,sub,cls=''){return '<div class="metric '+cls+'"><div class="k">'+label+'</div><div class="v">'+safeText(val)+'</div><div class="s">'+sub+'</div></div>'}
function progress(v){const p=pct(v);return p===null?'<div class="progress-meta"><span>进度暂无数据</span><span>—</span></div>':'<div class="progress"><i style="width:'+p+'%"></i></div><div class="progress-meta"><span>任务进度</span><span>'+p+'%</span></div>'}
function miniCard(d){
 const task=d.current_task;
 return '<article class="dept-mini" data-open="'+safeText(d.department_key)+'"><div class="row between"><h4>'+safeText(d.name)+'</h4><span class="status-pill '+workClass(d.work_state)+'">'+workLabel(d.work_state)+'</span></div><div class="row between" style="margin-top:9px"><span class="connection"><i class="lamp '+(d?.backend?.connected?'on':'')+'"></i>'+(d?.backend?.connected?'后台已连接':'后台未连接')+'</span><span class="status-pill '+stateClass(d.state)+'">'+safeText(d.state)+'</span></div><div class="task-title">'+(task?safeText(task.title):'<span class="muted">当前无执行任务</span>')+'</div>'+progress(task?.progress)+(d?.backend?.health==='attention'?'<div class="tiny" style="color:#ffd17a;margin-top:7px">⚠ 连接存在，但运行状态需关注</div>':'')+'</article>'
}
function attentionItems(){
 return depts().map(d=>{
   const reasons=[]; let severe=false;
   if(['stale','degraded','disabled'].includes(String(d.state))) reasons.push('运行状态 '+d.state);
   if(!d?.backend?.connected){reasons.push('后台未连接');severe=true}
   if(d?.current_task?.blockage){reasons.push('任务存在阻塞');severe=true}
   if(num(d?.task_stats?.failed_recent)>0) reasons.push('最近失败 '+num(d.task_stats.failed_recent)+' 项');
   return reasons.length?{d,reasons,severe}:null
 }).filter(Boolean).sort((a,b)=>Number(b.severe)-Number(a.severe));
}
function deptCard(d){
 const t=d.current_task,st=d.task_stats||{};
 return '<article class="dept-card"><div class="dept-head"><div><h4>'+safeText(d.name)+'</h4><div class="dept-meta"><span class="status-pill '+workClass(d.work_state)+'">'+workLabel(d.work_state)+'</span><span class="status-pill '+stateClass(d.state)+'">'+safeText(d.state)+'</span></div></div><div class="connection"><i class="lamp '+(d?.backend?.connected?'on':'')+'"></i><b>'+(d?.backend?.connected?'已连接':'未连接')+'</b></div></div>'+
 '<div class="ability-wrap">'+arr(d.abilities).slice(0,4).map(x=>'<span class="ability">'+safeText(x)+'</span>').join('')+'</div>'+
 '<div class="task-box"><h5>'+(t?safeText(t.title):'当前无执行任务 / No active task')+'</h5>'+(t?'<div class="row between"><span class="status-pill '+stateClass(t.status)+'">'+safeText(t.status)+'</span><span class="tiny muted">优先级 '+safeText(t.priority)+'</span></div>'+progress(t.progress)+(t.latest_summary?'<div class="summary-line line-clamp"><b>进展：</b>'+safeText(t.latest_summary)+'</div>':'')+(t.next_focus?'<div class="summary-line line-clamp"><b>下一步：</b>'+safeText(t.next_focus)+'</div>':'')+(t.blockage?'<div class="blockage">⚠ '+safeText(t.blockage)+'</div>':''):'<div class="muted tiny">当前部门没有正在执行的 Mission。</div>')+'</div>'+
 '<div class="stats"><div class="stat"><b>'+num(st.missions_total)+'</b><small>Mission总数</small></div><div class="stat"><b>'+num(st.missions_active)+'</b><small>活跃</small></div><div class="stat"><b>'+num(st.completed_recent)+'</b><small>最近完成</small></div><div class="stat"><b>'+num(st.failed_recent)+'</b><small>最近失败</small></div></div>'+
 '<div class="card-foot"><div class="tiny muted">最近活动：'+stamp(d.last_activity_at)+'</div>'+(d?.backend?.health==='attention'?'<div class="tiny" style="color:#ffd17a;margin-top:5px">⚠ 后台通道已登记，但运行健康需关注</div>':'')+'<div class="actions"><button class="btn" data-detail="'+safeText(d.department_key)+'">查看部门详情</button><button class="btn" data-conn="'+safeText(d.department_key)+'">后台连接</button></div></div></article>'
}
function overview(){
 const s=summary();
 return '<div class="hero"><div><div class="eyebrow">COMPANY PULSE · 实时运行态势</div><h2>公司全状态总览</h2><p>一眼掌握部门、任务、执行链与后台连接。</p></div><div class="update">数据时间 '+stamp(D?.generated_at)+'</div></div>'+
 '<div class="grid pulse">'+metric('部门总数',s.total??depts().length,'All departments','blue')+metric('后台已连接',s.connected??0,'Connected backends','good')+metric('任务中',s.busy??0,'Busy departments','blue')+metric('空闲中',s.idle??0,'Idle departments')+metric('需关注',s.attention??0,'Attention required',(num(s.attention)>0?'warn':'good'))+metric('活跃 Mission',activeMissions(),'Active missions','blue')+metric('Execution Lane',onlineLanes()+'/'+arr(D?.runner?.lanes).length,'Online / total','good')+'</div>'+
 '<div class="section-title"><div><h3>部门状态缩略墙</h3><span>Department Status Wall</span></div><span>点击卡片查看部门详情</span></div><div class="grid dept-wall">'+depts().map(miniCard).join('')+'</div>'+
 '<div class="section-title"><div><h3>关键后台服务</h3><span>Critical Services</span></div></div><div class="grid services">'+arr(D?.services).map(s=>'<div class="service"><div class="row between"><b>'+safeText(s.name_zh||s.name_en||s.key)+'</b><span class="status-pill '+stateClass(s.status)+'">'+safeText(s.status)+'</span></div><small>'+safeText(s.note)+'</small></div>').join('')+'</div>';
}
function departments(){
 const s=summary(),ats=attentionItems(),items=selected==='all'?depts():depts().filter(d=>d.department_key===selected);
 return '<div class="hero"><div><div class="eyebrow">DEPARTMENT CONTROL · 组织实时总控</div><h2>部门总控</h2><p>部门职责、当前任务、任务进度、后台连接、阻塞与最近活动统一查看。</p></div><div class="update">实时刷新 · '+stamp(D?.generated_at)+'</div></div>'+
 '<div class="grid pulse" style="grid-template-columns:repeat(5,minmax(0,1fr))">'+metric('总部门',s.total??depts().length,'Departments','blue')+metric('已连接',s.connected??0,'Connected','good')+metric('任务中',s.busy??0,'Busy','blue')+metric('空闲中',s.idle??0,'Idle')+metric('异常/关注',s.attention??0,'Attention',(num(s.attention)>0?'warn':'good'))+'</div>'+
 '<div class="controls"><button class="filter '+(selected==='all'?'active':'')+'" data-filter="all">全部部门</button>'+depts().map(d=>'<button class="filter '+(selected===d.department_key?'active':'')+'" data-filter="'+safeText(d.department_key)+'">'+safeText(d.name)+'</button>').join('')+'</div>'+
 (ats.length?'<div class="section-title"><div><h3>需要关注</h3><span>Attention Required</span></div><span>'+ats.length+' 项</span></div><div class="attention-list">'+ats.map(x=>'<div class="attention '+(x.severe?'severe':'')+'" data-detail="'+safeText(x.d.department_key)+'"><i class="bar"></i><div><b>'+safeText(x.d.name)+'</b><small>'+safeText(x.reasons.join(' · '))+'</small></div><span class="status-pill '+(x.severe?'bad':'attn')+'">'+(x.severe?'立即关注':'需关注')+'</span></div>').join('')+'</div>':'')+
 '<div class="section-title"><div><h3>'+(selected==='all'?'全部部门':safeText(items[0]?.name||'部门'))+'</h3><span>Live Department Cards</span></div><span>'+items.length+' / '+depts().length+'</span></div><div class="grid dept-grid">'+(items.length?items.map(deptCard).join(''):'<div class="empty">没有匹配的部门</div>')+'</div>';
}
function connections(){
 return '<div class="hero"><div><div class="eyebrow">BACKEND CONNECTIONS</div><h2>后台连接总览</h2><p>连接状态与运行健康分开显示：绿灯代表通道已登记，黄色提示代表已连接但运行需关注。</p></div></div><div class="grid dept-grid">'+depts().map(d=>'<article class="dept-card" style="min-height:275px"><div class="row between"><h4>'+safeText(d.name)+'</h4><div class="connection"><i class="lamp '+(d?.backend?.connected?'on':'')+'"></i><b>'+(d?.backend?.connected?'已连接':'未连接')+'</b></div></div><div class="'+(d?.backend?.connected?'big-lamp on':'big-lamp')+'" style="width:42px;height:42px;margin:18px 0"></div><div class="detail-kv"><span>Connection Type</span><b>'+safeText(d?.backend?.connection_type)+'</b><span>Runtime State</span><b>'+safeText(d?.backend?.runtime_state)+'</b><span>Health</span><b>'+safeText(d?.backend?.health)+'</b><span>Project Bound</span><b>'+(d?.backend?.project_bound?'Yes':'No')+'</b><span>Chat Bound</span><b>'+(d?.backend?.chat_bound?'Yes':'No')+'</b></div><div class="card-foot"><button class="btn" style="width:100%" data-conn="'+safeText(d.department_key)+'">查看连接详情</button></div></article>').join('')+'</div>';
}
function systems(){
 return '<div class="hero"><div><div class="eyebrow">SYSTEM STATUS</div><h2>系统状态</h2><p>执行 Lane、设备摘要与关键服务。</p></div></div><div class="section-title"><div><h3>Execution Lanes</h3><span>Execution Runtime</span></div></div><div class="grid lane-grid">'+arr(D?.runner?.lanes).map(l=>'<div class="panel"><div class="row between"><b>'+safeText(l.lane)+'</b><span class="status-pill good">online</span></div><div class="tiny muted" style="margin-top:9px">Last seen: '+stamp(l.last_seen_at)+'</div><div class="tiny muted" style="margin-top:4px">Worker: '+safeText(l.worker_version)+'</div></div>').join('')+'</div><div class="section-title"><div><h3>Services</h3><span>Critical Services</span></div></div><div class="grid services">'+arr(D?.services).map(s=>'<div class="service"><div class="row between"><b>'+safeText(s.name_zh||s.name_en||s.key)+'</b><span class="status-pill '+stateClass(s.status)+'">'+safeText(s.status)+'</span></div><small>'+safeText(s.note)+'</small></div>').join('')+'</div>';
}
function bind(){
 document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{selected=x.dataset.open;setPage('departments',selected)});
 document.querySelectorAll('[data-filter]').forEach(x=>x.onclick=()=>{selected=x.dataset.filter;nav();render()});
 document.querySelectorAll('[data-detail]').forEach(x=>x.onclick=()=>openDetail(x.dataset.detail));
 document.querySelectorAll('[data-conn]').forEach(x=>x.onclick=e=>{e.stopPropagation();openConn(x.dataset.conn)});
}
function render(){
 nav();
 const names={overview:'总览',departments:'部门总控',connections:'后台连接',systems:'系统状态'};$('crumb').textContent='控制中心 / '+names[page];
 $('page').innerHTML=!D?'<div class="empty">正在连接实时数据…</div>':page==='overview'?overview():page==='departments'?departments():page==='connections'?connections():systems();
 bind();
}
function findDept(key){return depts().find(d=>d.department_key===key)}
function openDetail(key){
 const d=findDept(key);if(!d)return;const t=d.current_task,st=d.task_stats||{},a=d.latest_activity;
 $('drawer').innerHTML='<div class="modal-head"><div><div class="eyebrow">DEPARTMENT DETAIL</div><h2 style="margin:7px 0">'+safeText(d.name)+'</h2><div class="dept-meta"><span class="status-pill '+workClass(d.work_state)+'">'+workLabel(d.work_state)+'</span><span class="status-pill '+stateClass(d.state)+'">'+safeText(d.state)+'</span></div></div><button class="close" id="closeDrawer">×</button></div>'+
 '<div class="detail-section"><h5>部门能力</h5><div class="ability-wrap">'+arr(d.abilities).map(x=>'<span class="ability">'+safeText(x)+'</span>').join('')+'</div></div>'+
 '<div class="detail-section"><h5>运行状态</h5><div class="detail-kv"><span>Work State</span><b>'+workLabel(d.work_state)+'</b><span>Runtime State</span><b>'+safeText(d.state)+'</b><span>Active Work</span><b>'+num(d.active_work)+'</b><span>Backend</span><b>'+(d?.backend?.connected?'已连接':'未连接')+'</b><span>Last Activity</span><b>'+stamp(d.last_activity_at)+'</b></div></div>'+
 '<div class="detail-section"><h5>当前任务</h5>'+(t?'<h3 style="font-size:14px">'+safeText(t.title)+'</h3><div class="row between"><span class="status-pill '+stateClass(t.status)+'">'+safeText(t.status)+'</span><span class="tiny muted">Priority '+safeText(t.priority)+'</span></div>'+progress(t.progress)+(t.latest_summary?'<p class="summary-line"><b>最新进展：</b>'+safeText(t.latest_summary)+'</p>':'')+(t.next_focus?'<p class="summary-line"><b>下一步：</b>'+safeText(t.next_focus)+'</p>':'')+(t.blockage?'<div class="blockage"><b>阻塞：</b> '+safeText(t.blockage)+'</div>':''):'<div class="empty">当前无执行任务</div>')+'</div>'+
 '<div class="detail-section"><h5>任务统计</h5><div class="stats"><div class="stat"><b>'+num(st.missions_total)+'</b><small>Mission总数</small></div><div class="stat"><b>'+num(st.missions_active)+'</b><small>活跃</small></div><div class="stat"><b>'+num(st.completed_recent)+'</b><small>最近完成</small></div><div class="stat"><b>'+num(st.failed_recent)+'</b><small>最近失败</small></div></div></div>'+
 (a?'<div class="detail-section"><h5>最近一次动作</h5><div class="detail-kv"><span>Task</span><b>'+safeText(a.task||a.capability||'—')+'</b><span>Status</span><b>'+safeText(a.status)+'</b><span>Time</span><b>'+stamp(a.time)+'</b><span>Result</span><b>'+safeText(a.result||'—').slice(0,800)+'</b></div></div>':'');
 $('drawerScrim').classList.add('show');$('closeDrawer').onclick=closeDrawer;
}
function openConn(key){
 const d=findDept(key);if(!d)return;const b=d.backend||{};
 $('modal').innerHTML='<div class="modal-head"><div><div class="eyebrow">BACKEND CONNECTION</div><h2 style="margin:7px 0">'+safeText(d.name)+'</h2></div><button class="close" id="closeModal">×</button></div><div class="'+(b.connected?'big-lamp on':'big-lamp')+'"></div><div class="connection-title">'+(b.connected?'后台已连接':'后台未连接')+'</div><p class="muted tiny" style="text-align:center;line-height:1.5">'+(b.connected?(b.health==='attention'?'后台通道已登记，但运行状态需关注。':'后台通道已登记，连接正常。'):'当前部门没有可用后台连接或已被禁用。')+'</p><div class="detail-section"><div class="detail-kv"><span>Connection Type</span><b>'+safeText(b.connection_type)+'</b><span>Runtime State</span><b>'+safeText(b.runtime_state)+'</b><span>Health</span><b>'+safeText(b.health)+'</b><span>Project Bound</span><b>'+(b.project_bound?'Yes':'No')+'</b><span>Chat Bound</span><b>'+(b.chat_bound?'Yes':'No')+'</b><span>最近活动</span><b>'+stamp(d.last_activity_at)+'</b></div></div>';
 $('modalScrim').classList.add('show');$('closeModal').onclick=closeModal;
}
function closeDrawer(){$('drawerScrim').classList.remove('show')}function closeModal(){$('modalScrim').classList.remove('show')}
async function load(){
 if(loading)return;loading=true;$('refreshBtn').textContent='↻ 更新中';
 try{const r=await fetch(API,{cache:'no-store',headers:{accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();D=j.data||j;$('topDot').className='mini-dot green';$('liveText').textContent='LIVE';$('sideState').textContent='实时连接';render()}
 catch(e){$('topDot').className='mini-dot red';$('liveText').textContent='OFFLINE';$('sideState').textContent='连接中断';$('page').innerHTML='<div class="empty">实时数据连接失败：'+safeText(e.message)+'</div>'}
 finally{loading=false;$('refreshBtn').textContent='↻ 刷新'}
}
document.querySelectorAll('.nav>button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
$('refreshBtn').onclick=load;$('mobileBtn').onclick=()=>$('sidebar').classList.toggle('open');
$('drawerScrim').onclick=e=>{if(e.target===$('drawerScrim'))closeDrawer()};$('modalScrim').onclick=e=>{if(e.target===$('modalScrim'))closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}});
render();load();setInterval(load,30000);
</script>
</body></html>
