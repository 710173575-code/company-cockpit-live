olid #193953;border-radius:9px;padding:8px;text-align:center}.stat b{display:block;font-size:15px}.stat small{font-size:9px;color:#758ba1}.card-foot{margin-top:auto;border-top:1px solid #19344d;padding-top:10px}.actions{display:flex;gap:7px;margin-top:9px}.actions .btn{font-size:10px;padding:7px 9px;flex:1}.btn.danger{border-color:#7d3543;background:#35171d;color:#ffb0bc}.btn.danger:hover{background:#4a1d26;border-color:#a84a5b}.btn.success{border-color:#237158;background:#0d3028;color:#93efd0}.btn.success:hover{background:#124438;border-color:#319676}.btn:disabled{opacity:.48;cursor:not-allowed;filter:saturate(.55)}.process-actions{display:flex;gap:8px;margin-top:auto;padding-top:12px}.process-actions .btn{flex:1}.control-banner{display:flex;align-items:center;gap:9px;border:1px solid #25445f;background:#0a1e31;border-radius:11px;padding:9px 11px;margin:0 0 14px;font-size:10px;color:#8fa9c1}.control-banner.good{border-color:#26684f;background:#0a2921;color:#a5efd2}.control-banner.warn{border-color:#6b5329;background:#291f0e;color:#ffd47d}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">▲</div><div><b>公司驾驶舱</b><small>COMPANY COCKPIT · LIVE</small></div></div>
  <div class="nav-label">COMMAND CENTER</div>
  <div class="nav">
    <button data-page="overview" class="active"><b>总览</b><small>Overview</small></button>
    <button data-page="departments"><b>部门总控</b><small>Department Control</small></button>
    <div class="dept-sub" id="deptSub"></div>
    <button data-page="connections"><b>后台程序</b><small>Background Processes · 隐藏后台</small></button>
    <button data-page="systems"><b>系统状态</b><small>System Status</small></button>
  </div>
  <div class="side-foot"><div class="side-live"><span class="mini-dot green"></span><b id="sideState">实时连接</b></div><div>公开只读 · Public Read Only</div></div>
</aside>
<div class="shell">
<header class="top">
  <button class="btn ghost mobile-toggle" id="mobileBtn">☰</button>
  <h1 id="crumb">控制中心 / 总览</h1><div class="grow"></div>
  <div class="live-pill"><span class="mini-dot green" id="topDot"></span><span id="liveText">LIVE</span></div>
  <button class="btn" id="refreshBtn">↻ 刷新</button>
</header>
<main class="content" id="page"></main>
</div>
</div>
<div class="drawer-scrim" id="drawerScrim"><aside class="drawer" id="drawer"></aside></div>
<div class="modal-scrim" id="modalScrim"><section class="modal" id="modal"></section></div>
<script>
const API='https://qqbetjlagqfhuczcwmbd.supabase.co/functions/v1/company-cockpit?api=1';
let D=null,page='overview',selected='all',loading=false;
const LOCAL_CONTROL_URL='http://127.0.0.1:8766';
let localControl={checked:false,available:false,token:null,keys:new Set(),note:'正在检测本机控制桥…'};
const $=id=>document.getElementById(id);
const arr=v=>Array.isArray(v)?v:[];
const num=v=>Number.isFinite(Number(v))?Number(v):0;
const pct=v=>v===null||v===undefined?null:Math.max(0,Math.min(100,Math.round(Number(v)||0)));
const safeText=v=>{
  let s=String(v??'—');
  s=s.replace(/https?:\/\/\S+/gi,'[链接已隐藏]').replace(/[A-Z]:\\[^\n\r\t]+/g,'[本地路径已隐藏]').replace(/laptop-[a-z0-9-]+/gi,'[设备已隐藏]').replace(/127\.0\.0\.1:\d+/g,'[本地服务]').replace(/CDP[^,;\n]*\d{4,5}/gi,'[CDP信息已隐藏]');
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
};
const stamp=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?safeText(v):d.toLocaleString('zh-CN',{hour12:false})};
const workLabel=v=>v==='busy'?'任务中':v==='attention'?'需督导':v==='idle'?'空闲中':v==='disabled'?'已停用':'未知';
const workClass=v=>v==='busy'?'busy':v==='attention'?'attn':v==='idle'?'idle':v==='disabled'?'disabled':'';
const stateClass=v=>/active|ready|healthy|online|completed/i.test(v||'')?'good':/disabled|failed|offline|error|critical/i.test(v||'')?'bad':/stale|degraded|blocked|attention|pending|waiting/i.test(v||'')?'attn':'';
const depts=()=>arr(D?.department_control);
const summary=()=>D?.department_summary||{};
const activeMissions=()=>depts().reduce((n,d)=>n+num(d?.task_stats?.missions_active),0);
const activeWork=()=>depts().reduce((n,d)=>n+num(d?.active_work),0);
const onlineLanes=()=>arr(D?.runner?.lanes).filter(x=>x?.last_seen_at).length;
const processes=()=>arr(D?.process_monitor);
const processSummary=()=>D?.process_summary||{};
const processRank={red:0,yellow:1,green:2,gray:3};
const lampClass=s=>s==='green'?'green':s==='yellow'?'yellow':s==='gray'?'gray':'red';
const yesNo=v=>v?'是 / Yes':'否 / No';
const portLabel=v=>v===true?'正常 / OK':v===false?'异常 / Failed':'不适用 / N/A';
const controlCapable=p=>localControl.available&&localControl.keys.has(String(p.process_key||''));
function controlButton(p){
 if(!localControl.checked)return '<button class="btn" disabled>检测本机控制…</button>';
 if(!localControl.available)return '<button class="btn" disabled>仅查看 / 本机控制离线</button>';
 if(!controlCapable(p))return '<button class="btn" disabled>由系统管理</button>';
 if(p.process_present)return '<button class="btn" disabled>运行中 / 无需操作</button>';

function taskTone(t){
 const tone=String(t?.supervision?.tone||'gray');
 return ['green','blue','yellow','red','gray'].includes(tone)?tone:'gray';
}
function taskPillClass(t){
 const tone=taskTone(t);
 return tone==='green'?'good':tone==='red'?'bad':tone==='yellow'?'attn':tone==='blue'?'busy':'idle';
}
function ageText(minutes){
 const m=Number(minutes);
 if(!Number.isFinite(m))return '暂无';
 if(m<1)return '不到1分钟';
 if(m<60)return Math.round(m)+'分钟';
 if(m<1440)return (m/60).toFixed(m>=600?0:1)+'小时';
 return (m/1440).toFixed(m>=10080?0:1)+'天';
}
function taskProgress(t){
 const p=pct(t?.progress),s=t?.supervision||{},tone=taskTone(t);
 const live=!!s?.browser_realtime?.generating || ['executing','recovering'].includes(String(s.state||''));
 const bar=p===null
  ? '<div class="progress-meta"><span>完成度暂无数据</span><span>—</span></div>'
  : '<div class="progress '+tone+(live?' live':'')+'"><i style="width:'+p+'%"></i></div><div class="progress-meta"><span>完成度估计</span><span>'+p+'%</span></div>';
 const rt=s?.browser_realtime||null;
 const hb=rt?.heartbeat_age_sec===null||rt?.heartbeat_age_sec===undefined?'':(' · 浏览器心跳 '+rt.heartbeat_age_sec+'秒');
 const action=s?.action?(' · '+safeText(s.action)):'';
 const last=t?.last_progress_at?stamp(t.last_progress_at):'暂无';
 const idle=t?.no_progress_minutes===null||t?.no_progress_minutes===undefined?'暂无':ageText(t.no_progress_minutes);
 return bar+'<div class="task-supervision '+tone+'"><div class="gov-head"><b><i class="gov-dot"></i>'+safeText(s.label||'状态待确认')+'</b><span>'+safeText(s.manager||'CEO任务督导器')+'</span></div><div class="gov-reason">'+safeText(s.reason||'等待实时执行证据')+'</div><div class="gov-time">最近真实进展：'+last+' · 未进展：'+idle+hb+action+'</div></div>';
}

function attentionItems(){
 return depts().map(d=>{
   const reasons=[]; let severe=false;
   if(['stale','degraded','disabled'].includes(String(d.state))) reasons.push('运行状态 '+d.state);
   if(!d?.backend?.connected){reasons.push('后台未连接');severe=true}
   if(d?.current_task?.blockage){reasons.push('任务存在阻塞');severe=true}
   if(num(d?.task_stats?.missions_attention)>0){reasons.push('CEO督导关注 '+num(d.task_stats.missions_attention)+' 项');severe=true}
   if(['red','yellow'].includes(String(d?.current_task?.supervision?.tone||''))){reasons.push(safeText(d.current_task.supervision.label||'任务需督导'));severe=String(d.current_task.supervision.tone)==='red'}
   if(num(d?.task_stats?.failed_recent)>0) reasons.push('最近失败 '+num(d.task_stats.failed_recent)+' 项');
   return reasons.length?{d,reasons,severe}:null
 }).filter(Boolean).sort((a,b)=>Number(b.severe)-Number(a.severe));
}

async function initLocalControl(){
 try{
  const r=await fetch(LOCAL_CONTROL_URL+'/session',{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  localControl={checked:true,available:!!j.ok,token:j.token||null,keys:new Set(arr(j.controllable_keys).map(String)),note:'本机控制桥在线；只允许启动未运行的后台。'};
 }catch(e){
  localControl={checked:true,available:false,token:null,keys:new Set(),note:'只有在运行 Company OS 的这台电脑上才能启动未运行的后台；其他设备保持只读。'};
 }
 if(page==='connections'&&D)render();
}
async function controlProcess(button){
 const key=button.dataset.processKey,action=button.dataset.processAction;
 const p=processes().find(x=>String(x.process_key)===String(key));
 if(!p||!localControl.available||!localControl.token||action!=='start')return;
 const msg='确定启动「'+p.name_zh+'」吗？如果对应计划任务已禁用，会同时启用它并立即启动。';
 if(!confirm(msg))return;
 button.disabled=true;button.textContent='处理中…';
 try{
  const r=await fetch(LOCAL_CONTROL_URL+'/control',{
   method:'POST',
   headers:{'content-type':'application/json','x-process-control-token':localControl.token},
   body:JSON.stringify({process_key:key,action})
  });
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok)throw new Error(j.detail||j.error||('HTTP '+r.status));
  alert(j.note_zh||'命令已提交；状态会在下一次心跳后更新。');
  setTimeout(()=>load(),3500);
 }catch(e){
  alert('操作失败：'+String(e?.message||e));
  button.disabled=false;button.textContent='启动后台';
 }
}
async function load(){
 if(loading)return;loading=true;$('refreshBtn').textContent='↻ 更新中';
 try{const r=await fetch(API,{cache:'no-store',headers:{accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();D=j.data||j;$('topDot').className='mini-dot green';$('liveText').textContent='LIVE';$('sideState').textContent='实时连接';render()}
 catch(e){$('topDot').className='mini-dot red';$('liveText').textContent='OFFLINE';$('sideState').textContent='连接中断';$('page').innerHTML='<div class="empty">实时数据连接失败：'+safeText(e.message)+'</div>'}
 finally{loading=false;$('refreshBtn').textContent='↻ 刷新'}
}

$('refreshBtn').onclick=load;$('mobileBtn').onclick=()=>$('sidebar').classList.toggle('open');
$('drawerScrim').onclick=e=>{if(e.target===$('drawerScrim'))closeDrawer()};$('modalScrim').onclick=e=>{if(e.target===$('modalScrim'))closeModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}});
render();initLocalControl();load();setInterval(load,5000);setInterval(initLocalControl,60000);
